<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中断されました - CoPact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans JP', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="assets/images/logo.png" alt="CoPact Logo" class="w-10 h-10 rounded-lg object-cover bg-gray-200" onerror="this.style.display='none'">
                <span class="text-2xl font-bold tracking-tight text-gray-900">CoPact</span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-10 md:p-14 rounded-3xl shadow-xl text-center max-w-lg w-full border border-gray-100">
            
            <!-- Warning Icon -->
            <div class="w-24 h-24 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-8">
                <svg class="w-12 h-12 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>

            <h1 class="text-3xl font-bold mb-4 text-gray-900">設定が中断されました</h1>
            
            <p class="text-gray-600 mb-10 leading-relaxed">
                口座登録のプロセスが完了していません。<br>
                アプリに戻り、もう一度ボタンを押して設定を再開してください。
            </p>

            <div class="space-y-4">
                <a href="copact://" onclick="window.close()" class="block w-full bg-gray-800 text-white px-6 py-4 rounded-xl font-bold hover:bg-black transition shadow-lg text-lg">
                    アプリに戻って再試行
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-8">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm text-gray-500">
                &copy; <script>document.write(new Date().getFullYear())</script> CoPact. All rights reserved.
            </p>
        </div>
    </footer>
</body>
</html>
