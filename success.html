<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定完了 - CoPact</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        .gradient-text {
            background: linear-gradient(to right, #6C2BD9, #FF6B35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* アニメーション: ポップアップ */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- ヘッダー -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="assets/images/logo.png" alt="CoPact Logo" class="w-10 h-10 rounded-lg object-cover bg-gray-200" onerror="this.style.display='none'">
                <span class="text-2xl font-bold tracking-tight text-gray-900">CoPact</span>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="bg-white p-10 md:p-14 rounded-3xl shadow-xl text-center max-w-lg w-full animate-pop border border-gray-100">
            
            <!-- 成功アイコン -->
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-8">
                <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>

            <!-- タイトル -->
            <h1 class="text-3xl font-bold mb-4 text-gray-900">口座登録が完了しました</h1>
            
            <!-- 説明文 -->
            <p class="text-gray-600 mb-10 leading-relaxed">
                Stripeアカウントとの連携が正常に完了しました。<br>
                この画面を閉じて、CoPactアプリに戻ってください。
            </p>

            <!-- アクションボタン -->
            <div class="space-y-4">
                <!-- ディープリンク用ボタン (アプリが対応していれば自動で開きますが、念のため) -->
                <a href="copact://" onclick="window.close()" class="block w-full bg-[#6C2BD9] text-white px-6 py-4 rounded-xl font-bold hover:bg-[#5b23b8] transition shadow-lg text-lg">
                    アプリに戻る
                </a>
                
                <p class="text-xs text-gray-400">
                    自動的に戻らない場合は、スマートフォンのアプリ切り替えでCoPactを選択してください。
                </p>
            </div>
        </div>
    </main>

    <!-- フッター -->
    <footer class="bg-gray-900 text-white py-8">
        <div class="container mx-auto px-6 text-center">
            <p class="text-sm text-gray-500">
                &copy; <script>document.write(new Date().getFullYear())</script> CoPact. All rights reserved.
            </p>
        </div>
    </footer>

</body>
</html>
